[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohortpatch"
version = "0.2.0"
description = "CohortPatch implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24","scipy>=1.11","matplotlib>=3.7","psutil>=5.9","scikit-learn>=1.3","joblib>=1.3"]

[project.scripts]
cohortpatch = "cohortpatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
activity = ["torch>=2.2"]
